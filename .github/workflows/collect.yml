name: collect

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression tests (offline)
        run: python3 -m unittest -v test_collectors
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Viewer tests (offline)
        run: node test_viewer.cjs
      - name: Collect
        run: python3 fetch_snapshot.py lobby --pages 5 --keep 3000 --archive ""
      - name: Commit if changed
        run: |
          git config user.name  "technocore-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "nothing new" && exit 0
          git commit -m "collect: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
