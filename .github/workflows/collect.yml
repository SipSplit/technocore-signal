name: collect and deploy

on:
  schedule:
    # GitHub schedules are best-effort. Offset from the top of the hour to reduce delay.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
      - "fetch_snapshot.py"
      - "index.html"
      - "test_collectors.py"
      - "test_viewer.cjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression tests (offline)
        run: python3 -m unittest -v test_collectors
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Viewer tests (offline)
        run: node test_viewer.cjs
      - name: Build bounded viewer snapshot
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp LICENSE _site/LICENSE
          python3 fetch_snapshot.py lobby \
            --out _site/data/lobby.json \
            --pages 1 \
            --keep 200 \
            --archive "" \
            --gap-log ""
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
